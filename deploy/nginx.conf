# ============================================================================
#  BunkSoft on your own Nginx — Subsel Tech Solutions Pvt Ltd
#
#  The same rules as web/_headers, netlify.toml and vercel.json. Drop this in
#  /etc/nginx/sites-available/bunksoft, adjust server_name and root, then:
#
#    nginx -t && systemctl reload nginx
#
#  TLS certificates from Let's Encrypt:
#    apt install certbot python3-certbot-nginx
#    certbot --nginx -d bunksoft.subsel.in
# ============================================================================

# Plain HTTP exists only to send people to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name bunksoft.subsel.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bunksoft.subsel.in;

  root /var/www/bunksoft/web;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/bunksoft.subsel.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bunksoft.subsel.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Do not advertise the version to anyone scanning for a vulnerable one.
  server_tokens off;

  # ------------------------------------------------------------- headers ---
  # `always` matters: without it these are dropped from error responses,
  # which is exactly when a browser is most willing to render something odd.
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; manifest-src 'self'; worker-src 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header X-DNS-Prefetch-Control "off" always;

  # ------------------------------------------------------- admin console ---
  # Nginx replaces the whole add_header set inside a location block, so every
  # header the console needs is repeated here. Leave one out and it is simply
  # absent on that path.
  location ^~ /admin/ {
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, max-age=0" always;

    # Optional: restrict the console to the office and to known staff IPs.
    # Commented out because a locked-out administrator cannot let themselves
    # back in. Uncomment once you are sure of the addresses.
    #   allow 203.0.113.0/24;
    #   deny  all;

    try_files $uri $uri/ /admin/index.html;
  }

  # ------------------------------------------------------------ caching ---
  # No hashes in the filenames, so code revalidates on every load and a deploy
  # reaches every forecourt at once. Offline working comes from the service
  # worker, not from the browser cache.
  location = /sw.js              { add_header Cache-Control "no-cache" always; }
  location = /index.html         { add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
  location ^~ /js/               { add_header Cache-Control "no-cache" always; }
  location ^~ /css/              { add_header Cache-Control "no-cache" always; }
  location ^~ /icons/            { add_header Cache-Control "public, max-age=604800" always; }

  # Dotfiles are never content. .env, .git and friends stay unreachable even
  # if one is ever copied into the web root by mistake.
  location ~ /\. { deny all; return 404; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  location / { try_files $uri $uri/ /index.html; }
}
