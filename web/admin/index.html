<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111A26">
<!-- Same policy as the header set, carried in the file so the console is
     protected even on a host that sends no headers. No cdnjs here: the console
     has no PDF library to load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; object-src 'none'">
<title>BunkSoft Admin Console</title>
<!-- Root-absolute, not relative. At /admin (no trailing slash) the browser
     takes / as the base directory, so ./admin.css would resolve to /admin.css
     and the page would load with no stylesheet and no script — a blank screen
     with nothing in the console to explain it. These work at /admin and
     /admin/ alike. They assume the site is served from the domain root, which
     every deployment recipe in the README does. -->
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Mulish:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/js/config.js"></script>
</head>
<body>

<!-- Sign-in and the access refusal live here. -->
<div id="gate"></div>

<!-- The console itself. -->
<div id="shell" hidden>
  <header class="abar">
    <div class="abrand">
      <span class="amark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7.5 3.5v5c0 4.3-3.1 8.2-7.5 9.5-4.4-1.3-7.5-5.2-7.5-9.5v-5z"/><path d="M9.3 12.2l1.9 1.9 3.6-3.7"/>
        </svg>
      </span>
      <span class="atitle">Bunk<i>Soft</i> <b>Admin</b></span>
    </div>
    <nav class="atabs" id="atabs" aria-label="Sections"></nav>
    <div class="aspacer"></div>
    <span class="awho" id="awho"></span>
    <button class="abtn ghost" id="a_theme" title="Toggle light / dark" aria-label="Toggle light / dark">◐</button>
    <button class="abtn ghost" id="a_out">Sign out</button>
  </header>

  <main class="awrap" id="aview"></main>
  <footer class="afoot">
    Subsel Tech Solutions Pvt Ltd · administration console ·
    <span id="a_idle" class="aidle"></span>
  </footer>
</div>

<div id="alayer"></div>
<div id="atoast" class="atoast" hidden></div>

<script type="module" src="/admin/admin.js"></script>
<noscript><p style="padding:24px;font:16px system-ui">The admin console needs JavaScript enabled.</p></noscript>
</body>
</html>
